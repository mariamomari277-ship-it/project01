<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form>

 <label for="fullname">Full Name</label>
        <input type="text" id="fullname" required>
        <br>
        <br>

        <label for="email">Email</label>
        <input type="email" id="email" required minlength="5">
        <br>
        <br>        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8"> 
        <br>
        <br>

        <label for="field">Status :</label><br>
        <label for="role">Student</label>
        <input type="radio" id="student" name="role" value="student">
        <br>
        <label for="professional">Professional</label>
        <input type="radio" id="professional" name="role" value="professional">
        <br>

        <br>
        <label for="field">Field :</label><br>
        <select id="field" name="field" required>
            <option value="cybersecurity">cybersecurity</option>
            <option value="web">Web Development</option>
            <option value="networking">Networking</option>
        </select>
        <br>
        <br>

        <label for="message">Message</label>
        <br>
        <textarea id="message" name="message" required minlength="10"></textarea>

        <br>
        <br>
        <label for="agreement">I agree to the terms</label>
        <input type="checkbox" id="agreement" name="agreement" required>
        <br>
        <br>
        <button type="submit">Register</button>
    </form>






</body>
</html>
